databaseChangeLog:
  - changeSet:
      id: 260717-07b
      author: Marek
      changes:
        - renameTable:
            oldTableName: REGISTER
            newTableName: REGISTERS
        - renameTable:
            oldTableName: OPERATION
            newTableName: OPERATIONS
        - renameColumn:
            tableName: OPERATIONS
            oldColumnName: OPERATIONS_FROM
            newColumnName: SOURCE_REGISTER_ID
            columnDataType: VARCHAR(63)
        - renameColumn:
            tableName: OPERATIONS
            oldColumnName: OPERATIONS_TO
            newColumnName: TARGET_REGISTER_ID
            columnDataType: VARCHAR(63)
        - addNotNullConstraint:
            tableName: OPERATIONS
            columnName: TARGET_REGISTER_ID
            columnDataType: VARCHAR(63)
        - addForeignKeyConstraint:
            baseColumnNames: SOURCE_REGISTER_ID
            baseTableName: OPERATIONS
            constraintName: OPERATIONS_SOURCE_REGISTER_FK
            deferrable: false
            initiallyDeferred: false
            referencedColumnNames: ID
            referencedTableName: REGISTERS
            validate: true
        - addForeignKeyConstraint:
            baseColumnNames: TARGET_REGISTER_ID
            baseTableName: OPERATIONS
            constraintName: OPERATIONS_TARGET_REGISTER_FK
            deferrable: false
            initiallyDeferred: false
            referencedColumnNames: ID
            referencedTableName: REGISTERS
            validate: true
